# Licence gate (NFR-6, FOUNDATION §9 rule 7). Run by `make check`.
[graph]
all-features = false

[licenses]
# Permissive licences of NFR-6, plus public-domain-equivalent and permissive variants recorded in A-004.
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
    "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "0BSD", "BSL-1.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
