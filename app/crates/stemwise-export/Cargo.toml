[package]
name = "stemwise-export"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
stemwise-core = { path = "../stemwise-core" }
stemwise-dsp = { path = "../stemwise-dsp" }
stemwise-engine = { path = "../stemwise-engine" }
stemwise-analysis = { path = "../stemwise-analysis" }
stemwise-ai = { path = "../stemwise-ai" }
serde = { version = "1.0.229", features = ["derive"] }
