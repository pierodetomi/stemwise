[package]
name = "stemwise-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "stemwise"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
stemwise-core = { path = "../crates/stemwise-core" }
stemwise-engine = { path = "../crates/stemwise-engine" }
stemwise-dsp = { path = "../crates/stemwise-dsp" }
stemwise-ai = { path = "../crates/stemwise-ai" }
stemwise-export = { path = "../crates/stemwise-export" }
stemwise-analysis = { path = "../crates/stemwise-analysis" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rayon = "1.12.0"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
