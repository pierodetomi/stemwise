[project]
name = "stemwise"
version = "0.0.0"
description = "PoC: AI-assisted mixing and mastering engine driven by numeric measurements only."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "GPL-3.0-or-later" }  # pedalboard and matchering are GPLv3 (PRD §7)
dependencies = [
    "httpx>=0.28.1",
    "librosa>=0.11.0",
    "matchering==2.0.6",
    "numpy>=2.4.6",
    "pedalboard>=0.9.26",
    "pydantic>=2.14.3",
    "pyloudnorm>=0.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "typer>=0.29.0",
]

[project.scripts]
stemwise = "stemwise.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stemwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not llm"]
markers = [
    "llm: calls the real model over the network; excluded by default, run with `make test-llm`",
    "req(*ids): links the test to PRD requirement ids, e.g. req('ANA-3')",
    "acceptance(milestone): acceptance criterion of a PRD §9 milestone, e.g. acceptance('M1')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow non-ASCII (e.g. "−", "±") in strings and comments
